[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prospector-reddit"
version = "0.2.0"
description = "Plug-and-play engine that mines Reddit for unmet needs — with an MCP server so Claude becomes a Reddit research specialist."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sampo", email = "lesttech.dev.sam@gmail.com" }]
keywords = ["reddit", "scraper", "mcp", "research", "market-research", "opportunity-mining"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0",
  "fastmcp>=2.0",
]

[project.optional-dependencies]
analyze = ["openai>=1.30"]
# Search by meaning: CPU embeddings (ONNX) in a sqlite-vec table.
semantic = ["fastembed>=0.5", "sqlite-vec>=0.1.6,<0.2", "numpy>=1.26"]
dev = ["pytest>=8.0"]

[project.scripts]
prospector = "prospector.cli:app"
prospector-mcp = "prospector.mcp_server:main"

[project.urls]
Homepage = "https://github.com/011-sam-110/Prospector"
Repository = "https://github.com/011-sam-110/Prospector"

[tool.hatch.build.targets.wheel]
packages = ["prospector"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "prospector/_profiles"
